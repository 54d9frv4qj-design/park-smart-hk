# ============================================================
# 泊得好 Park Smart HK — Docker Compose
# 服務：FastAPI + Worker + PostgreSQL(TimescaleDB) + Streamlit
# ============================================================
version: "3.8"

services:
  # --- PostgreSQL + TimescaleDB（生產資料庫）---
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: parksmart_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: park_smart_hk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- FastAPI 後端 ---
  api:
    build: .
    container_name: parksmart_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/park_smart_hk
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEBUG=false
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000

  # --- Worker：定時同步數據（每 10 分鐘）---
  worker:
    build: .
    container_name: parksmart_worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/park_smart_hk
      - REFRESH_INTERVAL_MINUTES=10
    depends_on:
      db:
        condition: service_healthy
    command: python scripts/sync_realtime.py

  # --- Streamlit 前端（可選，預設不啟動）---
  streamlit:
    build: .
    container_name: parksmart_streamlit
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/park_smart_hk
      - STREAMLIT_SERVER_HEADLESS=true
    depends_on:
      - api
    command: streamlit run streamlit_app/Home.py --server.port=8501 --server.address=0.0.0.0
    profiles:
      - full

volumes:
  pgdata:
