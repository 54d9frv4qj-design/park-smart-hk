# ============================================================
# 定時同步：每小時呼叫政府 API，抓取全港停車場實時空位
# ============================================================
name: Hourly Data Sync

on:
  schedule:
    # 每小時第 5 分鐘執行（避開整點高峰）
    - cron: "5 * * * *"
  workflow_dispatch: # 允許手動觸發

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 安裝依賴
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行 ETL 同步
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CSDI_TOKEN: ${{ secrets.CSDI_TOKEN }}
        run: |
          python scripts/sync_realtime.py

      - name: 上傳同步日誌
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-log-${{ github.run_id }}
          path: logs/
          retention-days: 30
